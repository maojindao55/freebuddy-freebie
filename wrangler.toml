name = "freebuddy-freebie"
compatibility_date = "2024-09-01"
main = "worker.js"

# 项目固定的 Cloudflare 账号（Account ID 不是密钥，Cloudflare 官方也把它当作可公开的标识符）。
# 写在这里让 wrangler 的所有命令——本地 CLI 和 GitHub Actions——都用同一个确定值，
# 不再从 GitHub Secret / Variable 读取账号 ID：填错账号是 7003 的常见来源，而这里只有一处可改。
# 不要改成其他账号的 ID：D1 binding 和 `wrangler d1 ...` 都依赖它。
account_id = "ca3b2549d8dcb98799c42e7b56f4e912"

# freebuddy.si 是绑定到本 Worker 的自定义域名（zone 与项目同属上面的账号，
# custom domain 的硬要求）：根路径是落地页，/freebie/ 是白嫖页，/api/* 与
# /v1/* 在两个域名下行为一致。*.workers.dev 域名保持可用，旧版客户端的
# iframe 仍从那里加载白嫖页（worker.js 里做内部重写，不发重定向）。
routes = [
  { pattern = "freebuddy.si", custom_domain = true }
]

[assets]
directory = "."
binding = "ASSETS"
# 资源未命中时回退到根目录的 404.html（落地页的 404，白嫖页路径下也用它）。
not_found_handling = "404-page"

# D1 数据库绑定说明：
# 方式 1（推荐）：在 Cloudflare 控制台 -> Workers & Pages -> 设置 -> 变量与绑定 -> 绑定 D1 数据库，变量名填 DB
# 方式 2：取消下方注释并填入你在 Cloudflare 创建的真实 database_id
[[d1_databases]]
binding = "DB"
database_name = "freebie-db"
database_id = "b95f4660-142c-4896-a71e-5ded41c64030"

[vars]
NEWAPI_BASE_URL = "http://106.13.104.125:3000"
DEFAULT_MODEL = "dots3-note-prev"
TRIAL_EXPIRES_HOURS = 48

